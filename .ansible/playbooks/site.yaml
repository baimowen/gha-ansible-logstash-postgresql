---
- name: manager user pass
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: create user
      user:
        name: ansible
        groups: wheel
        state: present
        generate_ssh_key: true
    - name: password-less access for operator
      copy:
        # src: ./templates/ansible
        content: |
          ansible ALL=(root) NOPASSWD: ALL
        dest: /etc/sudoers.d/ansible

- name: Deploy logging stack
  hosts: all
  become: true
  gather_facts: true
  remote_user: ansible
  roles:
    - role: podman
    - role: postgresql
    - role: logstash
  tasks:
    - name: Show system info
      ansible.builtin.debug:
        msg: "{{ item }}"
      loop:
        - "{{ ansible_hostname }}"
        - "{{ ansible_distribution }}"
        - "{{ ansible_distribution_version }}"
