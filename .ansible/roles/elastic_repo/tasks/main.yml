- name: Import Elastic GPG key
  ansible.builtin.rpm_key:
    key: "{{ elastic_repo_gpgkey }}"
    state: present

- name: Configure Elastic repository
  ansible.builtin.yum_repository:
    name: "{{ elastic_repo_name }}"
    description: "Elastic {{ elastic_repo_major_version }}.x packages"
    baseurl: "{{ elastic_repo_baseurl }}"
    gpgcheck: "{{ elastic_repo_gpgcheck | bool }}"
    gpgkey: "{{ elastic_repo_gpgkey }}"
    enabled: "{{ elastic_repo_enabled | bool }}"
    state: present
