- name: Reset elastic password to a random value
  ansible.builtin.command:
    cmd: podman exec {{ elasticsearch_container_name }} bin/elasticsearch-reset-password -u elastic -b
  register: reset_cmd
  when: (elasticsearch_ready.status | default(0)) != 200
  changed_when: true
  no_log: true

- name: Extract the newly generated password
  ansible.builtin.set_fact:
    generated_es_password: "{{ reset_cmd.stdout_lines | select('match', '^New value: ') | first | regex_replace('^New value: (.*)$', '\\1') }}"
  when: reset_cmd is defined and reset_cmd.stdout_lines is defined
  no_log: true

- name: Set password to the expected value via API
  ansible.builtin.uri:
    url: "http://127.0.0.1:9200/_security/user/elastic/_password"
    method: POST
    url_username: elastic
    url_password: "{{ generated_es_password }}"
    force_basic_auth: true
    body_format: json
    body:
      password: "{{ elasticsearch_password }}"
    status_code: 200
  when: generated_es_password is defined
  no_log: true

- name: Verify connection after potential reset
  ansible.builtin.uri:
    url: "http://127.0.0.1:9200/_cluster/health"
    url_username: elastic
    url_password: "{{ elasticsearch_password }}"
    force_basic_auth: true
    status_code: 200
  register: final_check
  no_log: true
  retries: "{{ elasticsearch_ready_retries }}"
  delay: "{{ elasticsearch_ready_delay }}"
  until: final_check is succeeded

- name: Set kibana_system password (same value as vault-managed elastic password)
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - "{{ elasticsearch_container_name }}"
      - bash
      - -c
      - >-
        curl -sf -X POST
        -u elastic:$ELASTIC_PASSWORD
        -H "Content-Type: application/json"
        http://127.0.0.1:9200/_security/user/kibana_system/_password
        -d "{\"password\":\"$ELASTIC_PASSWORD\"}"
  register: kibana_system_password
  changed_when: false
  failed_when: kibana_system_password.rc != 0

- name: Ensure kibana config directory exists
  ansible.builtin.file:
    path: "{{ kibana_config_dir }}/config"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy kibana configuration
  ansible.builtin.template:
    src: kibana.yml.j2
    dest: "{{ kibana_config_dir }}/config/kibana.yml"
    owner: root
    group: root
    mode: "0644"

- name: Deploy kibana container
  containers.podman.podman_container:
    name: "{{ kibana_container_name }}"
    image: "{{ kibana_image }}"
    state: started
    restart_policy: "{{ kibana_restart_policy }}"
    network: "{{ podman_network_name }}"
    mounts:
      - "type=bind,source={{ kibana_config_dir }}/config/kibana.yml,target=/usr/share/kibana/config/kibana.yml,readonly=true"
    publish: "{{ kibana_publish }}"
    env:
      ELASTIC_PASSWORD: "{{ elasticsearch_password }}"

- name: Ensure logstash pipeline directory exists
  ansible.builtin.file:
    path: "{{ logstash_pipeline_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy logstash pipeline configuration
  ansible.builtin.template:
    src: logstash.conf.j2
    # target host file
    dest: "{{ logstash_pipeline_dir }}/logstash.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart logstash container

- name: Deploy logstash container
  containers.podman.podman_container:
    name: "{{ logstash_container_name }}"
    image: "{{ logstash_image }}"
    state: started
    restart_policy: "{{ logstash_restart_policy }}"
    network: "{{ podman_network_name }}"
    # file mounting between the target host and its container
    volume:
      - "{{ logstash_pipeline_dir }}:/usr/share/logstash/pipeline:ro"
    publish: "{{ logstash_publish }}"
    env:
      LS_JAVA_OPTS: "{{ logstash_java_opts }}"
      ELASTIC_PASSWORD: "{{ elasticsearch_password }}"
      # POSTGRES_HOST: "{{ postgresql_container_name }}"
      # POSTGRES_PORT: "5432"
      # POSTGRES_USER: "{{ postgresql_user }}"
      # POSTGRES_PASSWORD: "{{ postgresql_password }}"
      # POSTGRES_DB: "{{ postgresql_db }}"
      XPACK_MONITORING_ENABLED: "false"

- name: disable xpack monitor
  ansible.builtin.lineinfile:
    path: /usr/share/logstash/logstash.yml
    line: "xpack.monitoring.enabled: false"
    insertafter: EOF
    create: yes

- name: Ensure filebeat config directory exists
  ansible.builtin.file:
    path: "{{ filebeat_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy filebeat configuration
  ansible.builtin.template:
    src: filebeat.yml.j2
    # target host file
    dest: "{{ filebeat_config_dir }}/filebeat.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart filebeat container

- name: Deploy filebeat container
  containers.podman.podman_container:
    name: "{{ filebeat_container_name }}"
    image: "{{ filebeat_image }}"
    state: started
    restart_policy: "{{ filebeat_restart_policy }}"
    network: "{{ podman_network_name }}"
    command: ["filebeat", "-e", "-c", "/usr/share/filebeat/filebeat.yml"]
    # file mounting between the target host and its container
    mounts:
      - "type=bind,source={{ filebeat_config_dir }}/filebeat.yml,target=/usr/share/filebeat/filebeat.yml,readonly=true"
      - "type=bind,source={{ source_logs_dir }},target=/var/log,readonly=true"
