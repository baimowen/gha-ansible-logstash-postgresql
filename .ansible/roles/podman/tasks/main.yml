- name: Set vm.max_map_count for elasticsearch
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    sysctl_set: true
    state: present
    reload: true

- name: Create volume for elasticsearch data
  containers.podman.podman_volume:
    name: "{{ elasticsearch_volume_name }}"
    state: present

- name: Ensure elasticsearch config directory exists
  ansible.builtin.file:
    path: "{{ elasticsearch_config_dir }}/config"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy elasticsearch configuration
  ansible.builtin.template:
    src: elasticsearch.yml.j2
    dest: "{{ elasticsearch_config_dir }}/config/elasticsearch.yml"
    owner: root
    group: root
    mode: "0644"

- name: Deploy elasticsearch container
  containers.podman.podman_container:
    name: "{{ elasticsearch_container_name }}"
    image: "{{ elasticsearch_image }}"
    state: started
    restart_policy: "{{ elasticsearch_restart_policy }}"
    network: "{{ podman_network_name }}"
    publish: "{{ elasticsearch_publish }}"
    volume:
      - "{{ elasticsearch_volume_name }}:/usr/share/elasticsearch/data"
    mounts:
      - "type=bind,source={{ elasticsearch_config_dir }}/config/elasticsearch.yml,target=/usr/share/elasticsearch/config/elasticsearch.yml,readonly=true"
    env:
      ELASTIC_PASSWORD: "{{ elasticsearch_password }}"  # the official image recognizes he environment variable as ELASTIC_PASSWORD
      ES_JAVA_OPTS: "{{ elasticsearch_java_opts }}"

- name: Wait for elasticsearch to accept connections
  ansible.builtin.uri:
    # a local uri task on the host can't be accessed by container name
    # because the host isn't in the podman_network
    # pre processing: the ES container needs to map ports to the host
    url: "http://127.0.0.1:9200/_cluster/health"
    url_username: elastic
    url_password: "{{ elasticsearch_password }}"
    force_basic_auth: true
    status_code: 200
  no_log: true
  failed_when: false  # failure will not interrupt
  changed_when: false
  register: elasticsearch_ready
  retries: "{{ elasticsearch_ready_retries }}"
  delay: "{{ elasticsearch_ready_delay }}"
  #retries: 1
  #delay: 1
  until: elasticsearch_ready.status == 200
