---
name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANSIBLE_CONFIG: ./.ansible/ansible.cfg

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Sync deps
        run: uv sync --group lint

      - name: Activate venv for later steps
        run: |
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Install Ansible collections and roles
        run: |
          ansible-galaxy collection install -r .ansible/requirements.yml
          ansible-galaxy role install -r .ansible/requirements.yml -p .ansible/roles/

      - name: Ensure actionlint
        run: |
          if ! command -v actionlint >/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
              | bash -s -- latest "$HOME/.local/bin"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Ensure shellcheck
        run: command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }

      - name: Lint shell scripts (shellcheck)
        run: make lint-shell

      - name: Lint YAML (yamllint)
        run: make lint-yaml

      - name: Lint workflows (actionlint)
        run: make lint-action

      - name: Lint Ansible (ansible-lint)
        run: make lint-ansible

      - name: Validate docker-compose
        env:
          POSTGRES_PASSWORD: ci-password
        run: make lint-compose
