---
name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANSIBLE_CONFIG: ./.ansible/ansible.cfg

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install yamllint ansible-core ansible-lint hvac

      - name: Install Ansible collections and roles
        run: |
          ansible-galaxy collection install -r .ansible/requirements.yml
          ansible-galaxy role install -r .ansible/requirements.yml -p .ansible/roles/

      - name: Ensure actionlint
        run: |
          if ! command -v actionlint >/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
              | bash -s -- latest "$HOME/.local/bin"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Ensure shellcheck
        run: command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }

      - name: Lint shell scripts (shellcheck)
        run: shellcheck scripts/*.sh

      - name: Lint YAML (yamllint)
        run: yamllint -c .yamllint .

      - name: Lint workflows (actionlint)
        # wildcard expansion is not supported
        # find .github/workflows \( -name '*.yaml' -o -name '*.yml' \) -type f -exec actionlint {} +
        run: actionlint - < .github/workflows/ci.yaml

      - name: Lint Ansible (ansible-lint)
        run: ansible-lint .

      - name: Validate docker-compose.yaml
        env:
          POSTGRES_PASSWORD: ci-password
        run: docker compose -f docker-compose.yaml config --quiet
