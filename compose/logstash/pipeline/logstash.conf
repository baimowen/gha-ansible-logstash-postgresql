# -------------------------------------------------
# Logstash pipeline – beats input → (empty filter) → JDBC → PostgreSQL
# -------------------------------------------------

# ---------------------- INPUT ----------------------
# Beats input (Filebeat 通过 TCP/5044 发送事件)
input {
  beats {
    port => 5044
    # 如需启用 TLS，可在此处配置 ssl => true + cert/path
    # codec => json_lines   # 默认即为 json_lines / plain old events
  }
}

# ---------------------- FILTER --------------------
# 目前保持空白，后续根据需要添加 filter {
#   grok { ... }
#   date { ... }
# }

# ---------------------- OUTPUT --------------------
# 将事件写入 PostgreSQL（容器内的 postgres 服务）
output {
  # 使用 logstash-output-jdbc（ansible-lint 中已安装的 ansible-core 包含 jdbc driver）
  jdbc {
    # 数据库连接信息 – 从 compose 的 env 变量或 .env 读取
    jdbc_driver_url => "https://jdbc.postgresql.org/download/postgresql-42.7.2.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    # connectionString 格式：jdbc:postgresql://<host>:<port>/<db>
    connection_string => "jdbc:postgresql://postgresql:5432/${POSTGRES_DB:-logs}"
    # 用户名/密码 – 同样从环境变量获取
    username => "${POSTGRES_USER:-logstash}"
    password => "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    # 目标表名（如不存在会由 logstash 创建或你可提前建表）
    table_name => "events"
    # 字段映射：将事件的 @message 放入 payload 列，@timestamp 放入 received_at
    columns => {
      message => "@message"
      received_at => "@timestamp"
    }
    # 预防因重复插入导致的主键冲突（使用 uuid 或事件 ID）
    # 这里使用 logstash 自动生成的 _id，若需要可自行指定主键列
    #    column_type => { "message" => "text", "received_at" => "timestamp" }
    #    statement => "INSERT INTO events (id, message, received_at) VALUES (?, ?, ?)"
    #    parameters => [ "%{uuid}", "%{message}", "%{@timestamp}" ]
  }
}