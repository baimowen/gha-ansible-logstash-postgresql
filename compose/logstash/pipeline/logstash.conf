# -------------------------------------------------
# Logstash pipeline – beats input → (empty filter) → JDBC → PostgreSQL
# -------------------------------------------------

# ---------------------- INPUT ----------------------
# Beats input (Filebeat 通过 TCP/5044 发送事件)
input {
  beats {
    port => 5044
    # 如需启用 TLS，可在此处配置 ssl => true + cert/path
    # codec => json_lines   # 默认即为 json_lines / plain old events
  }
}

# ---------------------- FILTER --------------------
# filter {
#   grok { ... }
#   date { ... }
# }

# ---------------------- OUTPUT --------------------
output {
  jdbc {
    jdbc_driver_url => "https://jdbc.postgresql.org/download/postgresql-42.7.2.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    connection_string => "jdbc:postgresql://postgresql:5432/${POSTGRES_DB:-logs}"
    username => "${POSTGRES_USER:-logstash}"
    password => "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    table_name => "events"
    columns => {
      message => "@message"
      received_at => "@timestamp"
    }
  }
}
