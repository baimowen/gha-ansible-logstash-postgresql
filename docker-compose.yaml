---
# 与 .ansible/roles/podman 保持一致的等价栈定义（本地开发 / CI 校验用）
name: logstash-postgresql

services:
  postgresql:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logstash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-logs}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-logstash} -d $${POSTGRES_DB:-logs}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - logging
    # ports:
    #   - "5432:5432"   # 如需从宿主机访问，取消注释

  logstash:
    image: docker.elastic.co/logstash/logstash:${LOGSTASH_VERSION:-8.17.0}
    restart: unless-stopped
    environment:
      LS_JAVA_OPTS: ${LS_JAVA_OPTS:--Xms512m -Xmx512m}
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-logstash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-logs}
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - logging
    ports:
      - "${LOGSTASH_BEATS_PORT:-5044}:5044"
      - "${LOGSTASH_API_PORT:-9600}:9600"

volumes:
  pgdata:

networks:
  logging:
    driver: bridge
